<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="50%"  stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="200" fill="url(#bg)"/>

  <!-- Waving bottom edge -->
  <path d="M0,155 Q200,175 400,160 Q600,145 800,165 Q1000,182 1200,158 L1200,200 L0,200 Z" fill="#0d1117" opacity="0.55"/>
  <path d="M0,170 Q300,190 600,175 Q900,160 1200,180 L1200,200 L0,200 Z" fill="#0d1117" opacity="0.4"/>

  <style>
    /* Random scramble chars — greenish flash */
    .r {
      font-family: 'Courier New', Courier, monospace;
      font-size: 78px;
      font-weight: bold;
      fill: #00ff88;
      opacity: 0;
      animation: rflash 0.13s linear forwards;
    }
    /* Settled final char — cyan with glow */
    .s {
      font-family: 'Courier New', Courier, monospace;
      font-size: 78px;
      font-weight: bold;
      fill: #00d4ff;
      filter: url(#glow);
      opacity: 0;
      animation: settle 0.18s linear forwards;
    }
    @keyframes rflash {
      0%   { opacity: 0;    }
      15%  { opacity: 0.9;  }
      85%  { opacity: 0.9;  }
      100% { opacity: 0;    }
    }
    @keyframes settle {
      0%   { opacity: 0; }
      40%  { opacity: 1; }
      100% { opacity: 1; }
    }
  </style>

  <!--
    "Febin Ani" — 9 chars (incl. space)
    Monospace 78px → char width ≈ 47px
    Total text width = 9 × 47 = 423px
    Start x = (1200 - 423) / 2 = 388.5 ≈ 389
    Positions: F=389, e=436, b=483, i=530, n=577,  =624, A=671, n=718, i=765
    y baseline = 118  (vertically centred in 200px)

    Stagger: each char starts 0.30s after the previous
    Per char: 4 random flashes × 0.13s = 0.52s scramble, then settle
    char_index × 0.30s  → base delay
  -->

  <!-- F  base=0.00s -->
  <text x="389" y="118" class="r" style="animation-delay:0.00s">X</text>
  <text x="389" y="118" class="r" style="animation-delay:0.13s">9</text>
  <text x="389" y="118" class="r" style="animation-delay:0.26s">#</text>
  <text x="389" y="118" class="r" style="animation-delay:0.39s">@</text>
  <text x="389" y="118" class="s" style="animation-delay:0.52s">F</text>

  <!-- e  base=0.30s -->
  <text x="436" y="118" class="r" style="animation-delay:0.30s">P</text>
  <text x="436" y="118" class="r" style="animation-delay:0.43s">%</text>
  <text x="436" y="118" class="r" style="animation-delay:0.56s">3</text>
  <text x="436" y="118" class="r" style="animation-delay:0.69s">W</text>
  <text x="436" y="118" class="s" style="animation-delay:0.82s">e</text>

  <!-- b  base=0.60s -->
  <text x="483" y="118" class="r" style="animation-delay:0.60s">Z</text>
  <text x="483" y="118" class="r" style="animation-delay:0.73s">*</text>
  <text x="483" y="118" class="r" style="animation-delay:0.86s">D</text>
  <text x="483" y="118" class="r" style="animation-delay:0.99s">^</text>
  <text x="483" y="118" class="s" style="animation-delay:1.12s">b</text>

  <!-- i  base=0.90s -->
  <text x="530" y="118" class="r" style="animation-delay:0.90s">|</text>
  <text x="530" y="118" class="r" style="animation-delay:1.03s">1</text>
  <text x="530" y="118" class="r" style="animation-delay:1.16s">!</text>
  <text x="530" y="118" class="r" style="animation-delay:1.29s">7</text>
  <text x="530" y="118" class="s" style="animation-delay:1.42s">i</text>

  <!-- n  base=1.20s -->
  <text x="577" y="118" class="r" style="animation-delay:1.20s">M</text>
  <text x="577" y="118" class="r" style="animation-delay:1.33s">^</text>
  <text x="577" y="118" class="r" style="animation-delay:1.46s">N</text>
  <text x="577" y="118" class="r" style="animation-delay:1.59s">$</text>
  <text x="577" y="118" class="s" style="animation-delay:1.72s">n</text>

  <!-- (space at x=624 — no elements needed) -->

  <!-- A  base=1.50s -->
  <text x="671" y="118" class="r" style="animation-delay:1.50s">Q</text>
  <text x="671" y="118" class="r" style="animation-delay:1.63s">4</text>
  <text x="671" y="118" class="r" style="animation-delay:1.76s">R</text>
  <text x="671" y="118" class="r" style="animation-delay:1.89s">@</text>
  <text x="671" y="118" class="s" style="animation-delay:2.02s">A</text>

  <!-- n  base=1.80s -->
  <text x="718" y="118" class="r" style="animation-delay:1.80s">W</text>
  <text x="718" y="118" class="r" style="animation-delay:1.93s">!</text>
  <text x="718" y="118" class="r" style="animation-delay:2.06s">H</text>
  <text x="718" y="118" class="r" style="animation-delay:2.19s">~</text>
  <text x="718" y="118" class="s" style="animation-delay:2.32s">n</text>

  <!-- i  base=2.10s -->
  <text x="765" y="118" class="r" style="animation-delay:2.10s">/</text>
  <text x="765" y="118" class="r" style="animation-delay:2.23s">+</text>
  <text x="765" y="118" class="r" style="animation-delay:2.36s">=</text>
  <text x="765" y="118" class="r" style="animation-delay:2.49s">;</text>
  <text x="765" y="118" class="s" style="animation-delay:2.62s">i</text>
</svg>
